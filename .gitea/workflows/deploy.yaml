name: Build and Deploy

on:
  push:
    branches: ["master"]
    paths-ignore:
      - ".gitea/**"
      - "README.md"
      - ".gitignore"
      - ".env.example"
  workflow_dispatch:
    inputs:
      branch:
        description: "ビルド・デプロイするブランチ（未指定なら実行ブランチ）"
        required: false
        default: ""

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."10.77.0.20"]
              http = true
              insecure = true

      - name: Login to Gitea Container Registry
        run: >-
          echo "${{ secrets.REGISTRY_TOKEN }}"
          | docker login 10.77.0.20 -u ${{ github.actor }} --password-stdin

      # cargo-chef の依存レイヤをレジストリの buildcache タグに保存・再利用する。
      # ランナーが使い捨てでも依存の再コンパイルを省け、ビルドが大幅に速くなる。
      - name: Build and push Docker image
        run: |
          docker buildx build \
            --cache-from type=registry,ref=10.77.0.20/greenland/yomiage:buildcache \
            --cache-to type=registry,ref=10.77.0.20/greenland/yomiage:buildcache,mode=max,ignore-error=true \
            --tag 10.77.0.20/greenland/yomiage:latest \
            --tag 10.77.0.20/greenland/yomiage:${{ github.sha }} \
            --push \
            .

      - name: Deploy to YUNAGI
        uses: appleboy/ssh-action@v1
        with:
          host: 10.77.0.17
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # restart 時のコンテナ停止（SIGTERM→SIGKILL）+ 起動待ちで 60s を超えうるため延長
          command_timeout: 5m
          envs: REGISTRY_TOKEN
          script: |
            set -eu
            IMAGE="10.77.0.20/greenland/yomiage:latest"

            # Giteaレジストリ認証（mox rootless podman。LAN内平文HTTPのため --tls-verify=false が必須）
            echo "$REGISTRY_TOKEN" | podman login --tls-verify=false 10.77.0.20 -u ${{ github.actor }} --password-stdin

            # 最新イメージ取得（set -eu により失敗時は即中断。旧バージョンのまま稼働継続）
            podman pull --tls-verify=false $IMAGE

            # コンテナは Quadlet(systemd user unit greenland-yomiage.service) が管理する。
            # Pull=never のためストアのイメージを更新した上で restart すると新イメージで再作成される。
            # podman stop/rm/run を直接実行すると systemd と競合するため絶対に行わない。
            # 停止が遅いと exit 137 で failed のまま残ることがあるため、その場合は start で復帰する。
            systemctl --user restart greenland-yomiage.service || true
            if [ "$(systemctl --user is-active greenland-yomiage.service)" != "active" ]; then
              systemctl --user reset-failed greenland-yomiage.service || true
              systemctl --user start greenland-yomiage.service
            fi

            # ヘルスチェック（最大約60秒ポーリング）
            for i in $(seq 1 30); do
              if [ "$(systemctl --user is-active greenland-yomiage.service)" = "active" ] && podman ps --filter name=^greenland-yomiage$ --format '{{.Status}}' | grep -q 'Up'; then
                echo "Deploy successful: container is running"
                exit 0
              fi
              sleep 2
            done
            echo "Deploy FAILED: service is not healthy"
            podman logs --tail 50 greenland-yomiage 2>/dev/null || true
            systemctl --user status greenland-yomiage.service --no-pager || true
            exit 1
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: Cleanup old registry versions (keep latest 20)
        if: always()
        run: |
          API="http://10.77.0.20/api/v1/packages/greenland/container/yomiage"
          TOKEN="${{ secrets.REGISTRY_TOKEN }}"

          # SHA タグのバージョンを作成日降順で取得し、20件より古いものを削除
          curl -s -H "Authorization: token $TOKEN" \
            "http://10.77.0.20/api/v1/packages/greenland?type=container&limit=50&sort=created_desc" \
          | python3 -c "
          import json, sys, urllib.request

          data = json.load(sys.stdin)
          # latest / buildcache / sha256: を除いたコミットSHAタグのみ抽出
          sha_versions = [p for p in data if p['name'] == 'yomiage'
                          and not p['version'].startswith('sha256:')
                          and p['version'] not in ('latest', 'buildcache')]
          # 新しい順にソート
          sha_versions.sort(key=lambda x: x['created_at'], reverse=True)

          # 20件より古いものを削除
          to_delete = sha_versions[20:]
          for v in to_delete:
              ver = v['version']
              url = f'$API/{ver}'
              req = urllib.request.Request(url, method='DELETE')
              req.add_header('Authorization', 'token $TOKEN')
              try:
                  urllib.request.urlopen(req)
                  print(f'Deleted: {ver}')
              except Exception as e:
                  print(f'Failed to delete {ver}: {e}')

          if not to_delete:
              print('No old versions to delete')
          "
